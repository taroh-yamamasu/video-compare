name: FormSync
options:
  minimumXcodeGenVersion: 2.42.0
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    CURRENT_PROJECT_VERSION: 1302
    MARKETING_VERSION: 1.3.2
    SWIFT_VERSION: 5.0
targets:
  FormSync:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FormSync
        excludes:
          - Resources
          - StoreKit
    settings:
      base:
        DEVELOPMENT_TEAM: KCVGFHSVP9
        PRODUCT_BUNDLE_IDENTIFIER: com.yamamasutaro.formsync
        PRODUCT_NAME: FormSync
        TARGETED_DEVICE_FAMILY: 1,2
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: KinePair
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: KinePair uses this permission only when you save an exported comparison to Photos.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
  FormSyncUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FormSyncUITests
    dependencies:
      - target: FormSync
    settings:
      base:
        DEVELOPMENT_TEAM: KCVGFHSVP9
        PRODUCT_BUNDLE_IDENTIFIER: com.yamamasutaro.formsync.uitests
        PRODUCT_NAME: FormSyncUITests
        TARGETED_DEVICE_FAMILY: 1,2
        TEST_TARGET_NAME: FormSync
        GENERATE_INFOPLIST_FILE: YES
  FormSyncTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FormSyncTests
    dependencies:
      - target: FormSync
    settings:
      base:
        DEVELOPMENT_TEAM: KCVGFHSVP9
        PRODUCT_BUNDLE_IDENTIFIER: com.yamamasutaro.formsync.tests
        PRODUCT_NAME: FormSyncTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  FormSync:
    build:
      targets:
        FormSync: all
        FormSyncUITests: [test]
    test:
      config: Debug
      targets:
        - FormSyncTests
        - FormSyncUITests
    run:
      config: Debug
      storeKitConfiguration: FormSync/StoreKit/FormSync.storekit
